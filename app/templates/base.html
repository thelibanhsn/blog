<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-blue-600">BLOG</a>
            <div>
                <a href="/" class="text-gray-700 hover:text-blue-600 px-3">Home</a>
                <a href="/about" class="text-gray-700 hover:text-blue-600 px-3">About</a>
                <!-- if user logs in, add logout  -->
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('auth_bp.logout') }}" class="text-gray-700 hover:text-blue-600 px-3">Logout</a>
                {% else %}
                    <a href="{{ url_for('auth_bp.login') }}" class="text-gray-700 hover:text-blue-600 px-3">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Page content -->
    <main class="container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
